<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="jev-blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fc3ff"/>
      <stop offset="1" stop-color="#0b4fb3"/>
    </linearGradient>
    <linearGradient id="jev-gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffe27a"/>
      <stop offset="1" stop-color="#e59a00"/>
    </linearGradient>
  </defs>
  <!-- the back half of the orbit, behind the letter -->
  <path d="M6 40 C 2 28, 30 10, 52 12 C 62 13, 62 20, 56 26" fill="none" stroke="url(#jev-gold)" stroke-width="5" stroke-linecap="round"/>
  <text x="32" y="50" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-style="italic"
        font-size="50" text-anchor="middle" fill="url(#jev-blue)" stroke="#083b86" stroke-width="1">J</text>
  <!-- the front of the orbit, sweeping across the letter -->
  <path d="M56 26 C 46 38, 18 52, 8 46" fill="none" stroke="url(#jev-gold)" stroke-width="5" stroke-linecap="round"/>
</svg>
